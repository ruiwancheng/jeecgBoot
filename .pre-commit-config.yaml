# Pre-commit hooks for JeecgBoot
# 由 2026-08-03 渗透测试复盘后沉淀
# 安装: pip install pre-commit && pre-commit install
# 手动跑: pre-commit run --all-files
#
# 设计原则:本地只跑纯 Python 的 semgrep,无网络依赖、无 Go toolchain
# gitleaks / trivy 留给 GitHub Actions(数据库下载太慢)

default_language_version:
  python: python3

repos:
  # ============================================================
  # semgrep: 项目特定 SAST 规则
  # 使用 repo: local 直接调本地 semgrep,避免 pre-commit 下载完整 Python 环境
  # 安装要求: semgrep 已通过 'uv tool install semgrep' 或 'pip install semgrep' 装好
  # ============================================================
  - repo: local
    hooks:
      - id: semgrep-jeecg-authorization
        name: semgrep-jeecg-authorization (CWE-862)
        entry: bash -c 'semgrep --config .semgrep/jeecg-authorization.yml --error --metrics=off --quiet'
        language: system
        types_or: [java]
        pass_filenames: false
      - id: semgrep-jeecg-secrets
        name: semgrep-jeecg-secrets (hardcoded creds)
        entry: bash -c 'semgrep --config .semgrep/jeecg-secrets.yml --error --metrics=off --quiet'
        language: system
        pass_filenames: false
      - id: semgrep-jeecg-injection
        name: semgrep-jeecg-injection (SQLi / cmd injection)
        entry: bash -c 'semgrep --config .semgrep/jeecg-injection.yml --error --metrics=off --quiet'
        language: system
        pass_filenames: false
