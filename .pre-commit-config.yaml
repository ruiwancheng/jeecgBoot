# Pre-commit hooks for JeecgBoot
# 由 2026-08-03 渗透测试复盘后沉淀
# 安装: pip install pre-commit && pre-commit install
# 手动跑: pre-commit run --all-files
#
# 本地 hook 故意精简:
#   - 只跑纯 Python 的 semgrep(快,无网络依赖)
#   - gitleaks 留给 GitHub Actions(下载 Go 依赖太慢)
#   - trivy 留给 GitHub Actions(数据库下载太慢)
#
# 完整检查在 .github/workflows/security-regression.yml 中跑

repos:
  # ============================================================
  # semgrep: 项目特定 SAST 规则
  # 防御 CWE-862 授权绕过 + 硬编码密钥 + 注入
  # ============================================================
  - repo: https://github.com/semgrep/semgrep
    rev: v1.172.0
    hooks:
      - id: semgrep
        name: semgrep-jeecg-authorization
        entry: semgrep --config .semgrep/jeecg-authorization.yml --error --metrics=off --quiet
        language: python
        types_or: [java]
        pass_filenames: false
        files: '\.java$'
      - id: semgrep
        name: semgrep-jeecg-secrets
        entry: semgrep --config .semgrep/jeecg-secrets.yml --error --metrics=off --quiet
        language: python
        pass_filenames: false
        files: '\.(yml|yaml|properties)$'
      - id: semgrep
        name: semgrep-jeecg-injection
        entry: semgrep --config .semgrep/jeecg-injection.yml --error --metrics=off --quiet
        language: python
        types_or: [java]
        pass_filenames: false
        files: '\.java$'
