encoding: utf-8
rules:
  # ============================================================
  # JeecgBoot 项目硬编码密钥检测
  # 由 2026-08-03 渗透测试复盘后沉淀
  # 防御 hardcoded-credentials / cleartext-storage
  # ============================================================

  - id: hardcoded-mysql-root-credentials
    languages: [generic]
    severity: ERROR
    message: >-
      检测到 MySQL root 凭据硬编码。所有 application*.yml 中的数据库密码应改为 ${MYSQL_PASSWORD:CHANGE_ME} 环境变量占位符。
      参考:2026-08-03 渗透测试 S-3 (MySQL root/root)。
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-regex: 'username:\s*root\s*\n\s*password:\s*root'
    paths:
      include:
        - "*.yml"
        - "*.yaml"

  - id: hardcoded-knife4j-credentials
    languages: [generic]
    severity: ERROR
    message: >-
      检测到 knife4j 鉴权密码硬编码 (jeecg/jeecg1314)。
      knife4j 启用会暴露全部 controller 的 OpenAPI 文档,该凭据让任何能访问 /doc.html 的人调用任意接口。
      参考:2026-08-03 渗透测试 S-1。
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: 'username:\s*jeecg\s*\n\s*password:\s*jeecg1314'
    paths:
      include:
        - "*.yml"
        - "*.yaml"

  - id: hardcoded-postgres-credentials
    languages: [generic]
    severity: ERROR
    message: >-
      检测到 embed-store Postgres 凭据硬编码 (postgres/postgres)。
      应使用专用账号 + ${EMBED_STORE_PASSWORD:} 环境变量。
      参考:2026-08-03 渗透测试 S-2/S-8。
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: '(user|username):\s*postgres\s*\n\s*password:\s*postgres'
    paths:
      include:
        - "*.yml"
        - "*.yaml"

  - id: hardcoded-nacos-default-credentials
    languages: [generic]
    severity: ERROR
    message: >-
      检测到 Nacos 默认凭据 (nacos/nacos)。
      生产部署必须修改默认账号。
      参考:2026-08-03 渗透测试 S-7。
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: 'username:\s*nacos\s*\n\s*password:\s*nacos'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.properties"

  - id: password-equals-question-marks-placeholder
    languages: [generic]
    severity: INFO
    message: >-
      检测到 password 占位符 "??",此为 JeecgBoot 项目的 placeholder 风格。
      部署前必须替换为真实凭据或环境变量。
    metadata:
      category: config
    pattern-regex: 'password\s*:\s*\?\?'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.properties"
