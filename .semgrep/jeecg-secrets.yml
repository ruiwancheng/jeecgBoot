encoding: utf-8
rules:
  # ============================================================
  # ============================================================

  - id: hardcoded-mysql-root-credentials
    languages: [generic]
    severity: ERROR
    message: >-
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    pattern-regex: 'username:\s*root\s*\n\s*password:\s*root'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
      exclude:
        - "jeecg-module-system/**"
        - "jeecg-server-cloud/**"
        - "jeecg-boot-base-core/**"

  - id: hardcoded-knife4j-credentials
    languages: [generic]
    severity: ERROR
    message: >-
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: 'username:\s*jeecg\s*\n\s*password:\s*jeecg1314'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
      exclude:
        - "jeecg-module-system/**"
        - "jeecg-server-cloud/**"
        - "jeecg-boot-base-core/**"

  - id: hardcoded-postgres-credentials
    languages: [generic]
    severity: ERROR
    message: >-
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: '(user|username):\s*postgres\s*\n\s*password:\s*postgres'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
      exclude:
        - "jeecg-module-system/**"
        - "jeecg-server-cloud/**"
        - "jeecg-boot-base-core/**"

  - id: hardcoded-nacos-default-credentials
    languages: [generic]
    severity: ERROR
    message: >-
    metadata:
      cwe: "CWE-798"
      category: security
    pattern-regex: 'username:\s*nacos\s*\n\s*password:\s*nacos'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.properties"
      exclude:
        - "jeecg-module-system/**"
        - "jeecg-server-cloud/**"
        - "jeecg-boot-base-core/**"

  - id: password-equals-question-marks-placeholder
    languages: [generic]
    severity: INFO
    message: >-
    metadata:
      category: config
    pattern-regex: 'password\s*:\s*\?\?'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.properties"
      exclude:
        - "jeecg-module-system/**"
        - "jeecg-server-cloud/**"
        - "jeecg-boot-base-core/**"
